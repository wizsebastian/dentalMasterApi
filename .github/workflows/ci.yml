name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: dental
          POSTGRES_DB: odonto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dental -d odonto"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://dental:dental@localhost:5432/odonto
      SECRET_KEY: ci-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Crear el esquema y los datos
        run: |
          export PGPASSWORD=dental
          psql -h localhost -U dental -d odonto -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
          psql -h localhost -U dental -d odonto -v ON_ERROR_STOP=1 -f db/init/02_seed_catalogos.sql
          psql -h localhost -U dental -d odonto -v ON_ERROR_STOP=1 -f db/dev/03_seed_demo.sql

      - name: Verificación de la base (79 aserciones)
        run: |
          export PGPASSWORD=dental
          psql -h localhost -U dental -d odonto -f db/99_verify.sql | tee verificacion.txt
          if grep -q "FAIL" verificacion.txt; then
            echo "::error::La verificación de la base falló"; exit 1
          fi

      - run: python -m app.cli db-baseline
      - run: python -m app.cli seed-users
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: pytest
